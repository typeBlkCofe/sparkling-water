// The REPL module is not available for all Spark/Scala combinations (e.g., Spark 4 port in this branch).
def replProject = findProject(':sparkling-water-repl')
if (replProject != null) {
  ext.publishedProjects += replProject
  ext.scalaProjects += replProject
}

// The Macro module causes Scala reflection issues with Spark 4 builds - exclude for Spark 4
def macrosProject = findProject(':sparkling-water-macros')
if (macrosProject == null) {
  // Remove macros from scala projects when building for Spark 4
  ext.scalaProjects.remove(project(':sparkling-water-macros'))
}

def versionSpecificProps = new Properties()
file("$rootDir/gradle-spark${spark}.properties").withInputStream { versionSpecificProps.load(it) }